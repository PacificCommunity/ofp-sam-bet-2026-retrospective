name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify saved native PAR archive
        run: python3 reproduce/restore.py --verify
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Check full-refit baseline preparation without executing models
        run: python3 ci/check-refit-baseline.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          Rscript --vanilla -e 'parse(file="reproduce/refit.R")'
          Rscript --vanilla ci/check-refit-paths.R
          make refit-plan
          Rscript -e 'paths <- list.files(".", pattern="[.][Rr]$", recursive=TRUE, full.names=TRUE); for (path in paths) parse(file=path)'
          Rscript -e 'paths <- list.files("data", pattern="[.]rds$", recursive=TRUE, full.names=TRUE); stopifnot(length(paths) > 0L); invisible(lapply(paths, readRDS))'
          python3 ci/verify-preserved-files.py
          git diff --exit-code
